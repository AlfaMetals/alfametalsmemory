<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALFA Metals QR-Code</title>
<style>body{font-family:Arial,sans-serif;max-width:620px;margin:35px auto;padding:0 16px;color:#082b55}h1{color:#073b78}input{width:100%;padding:12px;font-size:16px;border:1px solid #9abbd8;border-radius:8px;margin:8px 0 14px}button{padding:12px 16px;background:#073b78;color:white;border:0;border-radius:8px;font-weight:bold;font-size:16px}#out{margin-top:20px;text-align:center}img{max-width:300px;width:100%}.hint{color:#496783;font-size:14px}</style>
<h1>ALFA Metals – QR-Code erstellen</h1><p>Füge hier die öffentliche GitHub-Pages-Adresse deines Memory-Spiels ein.</p><label for="url">Adresse des Spiels</label><input id="url" type="url" placeholder="https://dein-benutzername.github.io/alfa-metals-memory/"><button id="make">QR-Code erstellen</button><div id="out"></div><p class="hint">Der QR-Code wird über einen externen QR-Dienst erstellt. Teste die Spieladresse zuerst mit deinem Handy.</p>
<script>document.querySelector('#make').onclick=()=>{const u=document.querySelector('#url').value.trim(),out=document.querySelector('#out');if(!/^https:\/\/.+/.test(u)){out.textContent='Bitte eine vollständige HTTPS-Adresse einfügen.';return;}out.innerHTML='';const img=document.createElement('img');img.alt='QR-Code für ALFA Metals Memory';img.src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(u);out.appendChild(img);const p=document.createElement('p');p.textContent=u;out.appendChild(p);const a=document.createElement('a');a.href=img.src;a.target='_blank';a.rel='noopener';a.textContent='QR-Code-Bild öffnen / speichern';out.appendChild(document.createElement('br'));out.appendChild(a);};</script></html>
